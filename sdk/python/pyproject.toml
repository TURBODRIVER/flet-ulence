[project]
name = "flet-project"
version = "0.1.0"
description = ""
authors = [{name = "Appveyor Systems Inc.", email ="hello@flet.dev"}]
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "flet",
    "flet-cli",
    "flet-desktop"
]

[tool.uv.sources]
flet = { workspace = true }
flet-cli = { workspace = true }
flet-desktop = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
test = [
]
dev = [
]
docs-coverage = [
]
docs = [
]
all = [
]


[tool.ruff]
line-length = 88
target-version = "py39"
fix = true
show-fixes = true
exclude = [
    ".github"
]

[tool.ruff.lint]
pydocstyle = { convention = 'google' }
isort = { known-first-party = [
    "flet",
    "flet_cli",
    "flet_desktop"
] }
preview = true
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80


[tool.pytest.ini_options]
pythonpath = ["."]
