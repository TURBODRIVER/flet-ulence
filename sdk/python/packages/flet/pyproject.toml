[project]
name = "flet"
version = "0.85.99"
description = "Flet for Python - easily build interactive multi-platform apps in Python"
authors = [{name = "Appveyor Systems Inc.", email = "hello@flet.dev"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet-cli; extra == 'cli'",
    "repath >=0.9.0",
    "msgpack >=1.1.0"
]

[project.urls]
Homepage = "https://flet.dev"
Repository = "https://github.com/flet-dev/flet"
Documentation = "https://flet.dev/docs/"

[project.optional-dependencies]
all = [
    "flet-cli",
    "flet-desktop",
]
cli = ["flet-cli"]
desktop = ["flet-desktop"]

[project.scripts]
flet = "flet.cli:main"

[dependency-groups]
extensions = []
dev = [
    "tomlkit >=0.11.6",
    "numpy >=2.2.0",
    "ruff >=0.13.1",
]
all = [
    { include-group = 'dev' },
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
flet = [
    "controls/material/icons.json",
    "controls/material/icons.pyi",
    "controls/cupertino/cupertino_icons.json",
    "controls/cupertino/cupertino_icons.pyi",
]
