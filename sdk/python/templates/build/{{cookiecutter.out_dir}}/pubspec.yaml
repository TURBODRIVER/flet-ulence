name: '{{ cookiecutter.project_name }}'
description: '{{ cookiecutter.project_description }}'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flet:
    path: path/to/flet-ulence/in/pubspec_overrides.yaml

  # MsgPack codec used by the dart_bridge FletBackendChannel implementation
  # in lib/main.dart — matches the wire format flet's existing socket
  # transport already speaks.
  msgpack_dart: ^1.0.1
  path: ^1.9.0
  path_provider: ^2.1.4
  serious_python: 4.5.1
  window_manager: ^0.5.1

dependency_overrides:
  flet:
    path: ../../../../../packages/flet

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "images/icon.png"
  windows:
    generate: true
    image_path: "images/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "images/icon.png"
