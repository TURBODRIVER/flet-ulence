name: '{{ cookiecutter.project_name }}'
description: '{{ cookiecutter.project_description }}'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flet:
    path: path/to/flet-ulence/in/pubspec_overrides.yaml
  serious_python: 1.0.0

  path_provider: ^2.1.4
  path: ^1.9.0
  window_manager: ^0.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - app/app.zip
    - app/app.zip.hash

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "images/icon.png"
  windows:
    generate: true
    image_path: "images/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "images/icon.png"
