  equatable: ^2.0.3
  file_picker: ^10.3.10
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.7
  flutter_markdown_plus_latex: ^1.0.5
  flutter_svg: ^2.2.1
  highlight: ^0.7.0
  http: ^1.5.0
  macos_haptic_feedback: ^1.0.0
  markdown: ^7.3.0
  msgpack_dart: ^1.0.1
  pasteboard: ^0.4.0
  path: ^1.9.0
  path_provider: ^2.1.5
